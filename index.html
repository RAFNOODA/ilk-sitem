<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2App Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.1);
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            background: linear-gradient(90deg, #00ffcc, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            margin-top: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(90deg, #00ffcc, #0284c7);
            color: #0f172a;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🚀</div>
        <h1>Web2App Studio</h1>
        <p>Sıradan web sitelerini saniyeler içinde yeni nesil mobil uygulamalara dönüştürüyoruz.</p>
        <button class="btn">Uygulamayı Yükle</button>
    </div>

</body>
</html>
